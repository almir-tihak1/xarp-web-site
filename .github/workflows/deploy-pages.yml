# Builds the site and publishes it on GitHub Pages after every push to `main`
# (also a new blog post saved through Pages CMS or the GitHub website).
#
# One-time setup in the GitHub repository: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# The address then shows up in Settings → Pages and in the Actions tab after every run.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # "Run workflow" button in the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits instead of cancelling the one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Tells us where GitHub serves the site: https://xarp-tec.github.io/ or a custom domain → base path "",
      # any other repository name → https://<owner>.github.io/<repo>/ → base path "/<repo>".
      - id: pages
        uses: actions/configure-pages@v6

      - run: npm ci

      - run: npm run build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Optional contact form endpoint (see .env.example):
          # Settings → Secrets and variables → Actions → Variables → CONTACT_ENDPOINT
          NEXT_PUBLIC_CONTACT_ENDPOINT: ${{ vars.CONTACT_ENDPOINT }}
          NEXT_TELEMETRY_DISABLED: 1

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
